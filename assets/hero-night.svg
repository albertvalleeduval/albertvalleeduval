<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240" role="img" aria-label="Business student by day, AI engineer by night.">
  <defs>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <clipPath id="frame">
      <rect width="880" height="240" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="880" height="240" fill="#0b0d14"/>

    <g filter="url(#soft)">
      <circle cx="150" cy="80" r="104" fill="#4c3fd6" opacity="0.85">
        <animate attributeName="cx" values="150;236;150" dur="22s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="80;132;80" dur="18s" repeatCount="indefinite"/>
      </circle>
      <circle cx="352" cy="196" r="90" fill="#2a6ef0" opacity="0.7">
        <animate attributeName="cx" values="352;268;352" dur="26s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="196;146;196" dur="20s" repeatCount="indefinite"/>
      </circle>
      <circle cx="690" cy="150" r="80" fill="#7b4ce0" opacity="0.6">
        <animate attributeName="cy" values="150;92;150" dur="24s" repeatCount="indefinite"/>
        <animate attributeName="r" values="80;100;80" dur="16s" repeatCount="indefinite"/>
      </circle>
      <circle cx="836" cy="64" r="62" fill="#1e9fd8" opacity="0.5">
        <animate attributeName="cx" values="836;778;836" dur="28s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect width="880" height="240" fill="#0b0d14" opacity="0.34"/>

    <g fill="#ffffff">
      <circle cx="640" cy="44" r="1.4" opacity="0.7">
        <animate attributeName="opacity" values="0.7;0.15;0.7" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="742" cy="92" r="1.1" opacity="0.5">
        <animate attributeName="opacity" values="0.5;0.1;0.5" dur="5.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="588" cy="196" r="1.2" opacity="0.45">
        <animate attributeName="opacity" values="0.45;0.08;0.45" dur="6.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="806" cy="168" r="1.3" opacity="0.6">
        <animate attributeName="opacity" values="0.6;0.12;0.6" dur="4.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g font-family="Segoe UI, SF Pro Display, Helvetica Neue, Arial, sans-serif">
      <text x="54" y="112" font-size="42" font-weight="700" fill="#ffffff" opacity="0.22">Business student by day.</text>
      <text x="54" y="160" font-size="42" font-weight="700" fill="#ffffff">AI engineer by night.</text>
    </g>

    <g opacity="0.92" transform="translate(806 196)">
      <path d="M 0 -15 A 15 15 0 1 0 10 12 A 17 17 0 0 1 0 -15 Z" fill="none" stroke="#a9b6ff" stroke-width="1.6" stroke-linejoin="round"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="16s" repeatCount="indefinite" additive="sum"/>
    </g>

    <rect width="880" height="240" rx="14" fill="none" stroke="#232842" stroke-width="1.5"/>
  </g>
</svg>
